# agent-map.yaml — 技能农场唯一事实源
#
# 主库 ~/projects/dc-skills 是全机唯一物理技能目录（git 仓库，远端为 GitHub）。
# 每个 Agent 只通过自己技能目录里的软链接看到启用技能；未登记的技能对任何 Agent 不可见。
#
# 用法：
#   cd ~/projects/dc-skills && uv run python scripts/skills-sync   # 物化全部农场
#   uv run python scripts/skills-sync --check                     # 只检查漂移，不修改
#
# 启用一个按需技能：把技能名加进对应 agent 的 extra，再跑 skills-sync。
# 安装器着陆区 ~/.agents/skills（通用技能安装器的默认目标，见 .skill-lock.json）：
#   Orca 官方技能（orca-cli/orchestration/computer-use，2026-10-15 定策）常驻该区走官方
#   `npx skills update` 更新，不收编主库；其他来源新技能仍按 mv 进主库登记流程处理。
#
# ── 各 Agent 自注册根与可控配置（2026-09-23 实测；完整机制与风险见 技能管理.md）──
# claude-code: 自注册 = 插件市场 ~/.claude/plugins/cache + 账号同步 ~/.claude/skills/synced（农场根内，须保持关闭）
#              可控 = settings.json 的 enabledPlugins/skillOverrides/blockedMarketplaces，CLAUDE_CODE_SYNC_SKILLS=0
# grok:       自注册 = ~/.grok/bundled/skills（随 App 更新）；可控 = config.toml [skills] ignore/paths/disabled
# codex:      自注册 = ~/.codex/skills/.system + 插件缓存 ~/.codex/plugins/cache + 模型可触发的 skill-installer
#              可控 = config.toml [skills] bundled/include_instructions/max_context_tokens（无路径 ignore 能力）
# dsh:        自注册 = 只装插件不装技能；出厂 cordis 预设自带 2 技能（customSkillDirs rank 300 > 农场 400）
#              可控 = 各预设 agent.cordis.yml 的 skill-filesystem config（customSkillDirs/includeDefaultRoots）
# orca:       自注册 = orca skills install 转发社区 skills CLI（npx skills add --global），可写农场目录
#              可控 = 安装时 --agent universal / --agent <names>；orca 系官方技能常驻着陆区
#              ~/.agents/skills 由官方通道更新（2026-10-15 定策，不再 mv 收编；skillctl inventory 监控）
# lark-cli:   自注册 = 28 域技能编译进二进制（lark-cli skills read），随 lark-cli update 走
# keenable:   无技能自注册（仅 MCP server + managed_deny_tools），无需处理
#
# dsh 预设语义：dsh 运行时不扫描 <preset>/skills/，预设 skills 目录须经预设 agent.cordis.yml 的
#   skill-filesystem.customSkillDirs 接入（rank 300，仅该预设会话可见）。2026-09-23 已为
#   thesis-agent / plugin-specialist 接入；全会话可见的技能另入 dsh extra（rank 400）。

master: /home/dc/projects/dc-skills

# master 的 Windows UNC 视图：仅 skills-sync 在 Windows 上运行时替换解析（与 master 平级）
master_win: //wsl.localhost/Ubuntu-New/home/dc/projects/dc-skills

# 全局基座：默认进入所有 Agent 农场。
# 加载语义（2026-09-24 族群化）：base 内技能分两种加载模式——
#   entry（族群入口，load: auto）：进模型启动清单，自动触发后按路由表按需读成员 SKILL.md
#   member（族内技能，load: manual）：不进启动清单（省 token），可 /name 或 $name 显式触发
# 族群划分见文末 families 段；标记一致性由 skills-sync --check 校验。
base:
  # ── drawing（entry: diagram；design-* 属于 frontend，不在本族）──
  - diagram             # 7 类图表统一入口（脚本目录 diagram-* 随主库，不单独成链）
  - drawio-xml          # .drawio 原生图表（member）
  # ── frontend（entry: design-ui）──
  - design-ui           # 前端页面设计
  - design-diagram      # 内联 SVG 图表规范（member）
  - design-dataviz      # 数据可视化设计系统（member）
  # ── thesis（entry: thesis-writing）──
  - thesis-writing      # 论文写作（毕设/期刊双模式）
  - thesis-ref-check    # 论文术语一致性检查
  - md-to-thesis-latex  # 毕业论文 md→LaTeX→PDF
  - paper-metrics       # 论文写作特征指标层
  - paper-reader        # 论文 PDF 双引擎阅读（venvs 11GB）
  # ── software（entry: programming；codegraph / github 是成员，不是入口）──
  - programming         # 编程任务分流（oh-my-openagent 4.17.1 vendored）
  - debugging           # 系统化调试（omo vendored）
  - git-master          # 已有仓库的本地 git（omo vendored）
  - remove-ai-slops     # AI 味代码清除（omo vendored）
  - test-guardian       # 测试工程质量规范
  - codegraph-explore   # 任意语言的大仓符号检索（member）
  - github-workflow     # GitHub 仓库生命周期（member）
  # ── standalone manual（详见文末 standalone 段）──
  - task-hub            # 跨会话任务中心（standalone manual，2026-10-15 出 agentops）
  # ── info（entry: unified-search）──
  - unified-search      # 10 源聚合搜索
  - kimi-webbridge      # 真实浏览器控制
  - vision-workflow     # 视觉任务编排
  # ── standalone（不设族群；auto/manual 见文末 standalone 段，2026-10-15 单体族解散）──
  - db-skill            # 只处理 MySQL/PostgreSQL（standalone auto）
  - wsl-windows-bridge  # WSL→Windows 跨边界框架（standalone auto）
  - word-extractor      # .docx 高精度提取（standalone manual）
  - lark-cli            # 飞书全家桶统一入口，28 域内聚（standalone auto）
  # ── dshplugin（entry 与 member 都在 base，否则成员没有自动入口）──
  - dsh-plugin-troubleshooting  # DSH 插件故障排查（entry，auto）
  - dsh-ui-optimization         # DSH 插件 UI 优化（member；plugin-specialist 预设亦挂载）
  - dc-skill-creator    # 本仓库技能创建工具（standalone auto；validate/new_skill/check_triggers）
  # ── standalone manual 运维技能 ──
  - proxy-ops
  - cloudreve-storage   # Cloudreve 云存储（standalone manual，2026-10-15 出 agentops）
  - agent-balances      # 查询各编程 Agent 额度与用量（standalone manual，2026-10-15 出 agentops）

# 按需技能：默认不进任何农场。目前为空；新的按需技能写在这里，再放进某个 agent 的 extra。
on_demand:

agents:
  claude-code:
    dir: ~/.claude/skills
    skills: base
    extra: []

  grok:
    dir: ~/.grok/skills
    skills: base
    extra: []

  dsh:
    dir: ~/.dsh/skills
    skills: base
    extra: []   # 2026-09-24：dsh-ui-optimization 已随族群化入 base，extra 清空（thesis-export 已于 2026-10-15 归档）
    presets:
      # 论文族挂 thesis-agent 预设：跨项目的任务维度按需加载
      thesis-agent:
        dir: ~/.dsh/.agent-presets/thesis-agent/skills
        skills:
          - thesis-writing
          - thesis-ref-check
          - md-to-thesis-latex
          - paper-metrics
          - paper-reader
      # 插件开发预设：技能已收编主库，预设根其余资源（RULES.md/docs/scripts）不动
      plugin-specialist:
        dir: ~/.dsh/.agent-presets/plugin-specialist/skills
        skills:
          - dsh-ui-optimization
          - dsh-plugin-troubleshooting

  zcode:
    dir: ~/.zcode/skills
    skills: base
    extra: []

  codex:
    dir: ~/.codex/skills
    skills: base
    extra: []   # 注：~/.codex/skills/.system 为 Codex 自带系统技能，skills-sync 不碰真实目录

  # Windows 侧只读消费（DSH 等会话）：platform=windows 使 WSL 侧跳过，Windows 侧处理
  dsh-win:
    dir: C:/Users/32841/.dsh/skills
    platform: windows
    skills: []                # 只读消费侧不吃 base（base 多依赖 WSL 运行时）
    extra:                    # 显式挑 Windows 会话用得上的
      - git-master
      - dc-skill-creator
      - unified-search

standalone:
  proxy-ops:
    load: manual
    description: "梯子网络管理与节点切换"
  word-extractor:
    load: manual
    description: ".docx 高精度提取（2026-10-15 officecli 归档、docs 族解散后转单体）"
  task-hub:
    load: manual
    description: "跨会话任务中心总线：任务新建/推进/查询/依赖调度（2026-10-15 出 agentops 转单体）"
  cloudreve-storage:
    load: manual
    description: "Cloudreve 云存储网盘操作与备份管理（2026-10-15 出 agentops 转单体）"
  agent-balances:
    load: manual
    description: "查询各编程 Agent 额度与用量余额（2026-10-15 出 agentops 转单体）"
  # ── 2026-10-15 单体族解散：四技能转 standalone auto（保持原 entry 自动触发不变）──
  db-skill:
    load: auto
    description: "MySQL/PostgreSQL 查询与写入"
  wsl-windows-bridge:
    load: auto
    description: "WSL→Windows 跨边界框架：本地调用/SSH 特权/GPU 治理"
  lark-cli:
    load: auto
    description: "飞书/Lark 全家桶统一入口（28 域聚合）"
  dc-skill-creator:
    load: auto
    description: "本仓库技能创建工具：脚手架生成 + 规则校验"

mcps:
  codegraph:
    transport: stdio
    command: codegraph
    args: ["serve", "--mcp"]
    clients: [claude]
    emit: full
    enabled: true

  keenable:
    transport: http
    url: "https://api.keenable.ai/mcp"
    clients: [claude]
    emit: full
    enabled: true

  vision:
    transport: http
    url: "http://127.0.0.1:8973/mcp"
    clients: [claude]
    emit: full
    enabled: true

# ── 族群（2026-09-24 重分类；2026-09-24 族群化）─────────────────────────
# 原则（用户 2026-09-24 定调）：不硬凑——不相关的技能宁可单体族；同源/同工作流的聚为族。
# entry   = 族群入口，load: auto，进模型启动清单；正文含族内路由表
# members = 族内技能，默认 load: manual——不进启动清单（SKILL.md 标 metadata.load-mode:
#           manual + disable-model-invocation: true；Codex 侧生成 agents/openai.yaml 的
#           policy.allow_implicit_invocation: false），经 /name 或 $name 显式触发
# 成员覆写：members: {name: auto} 可把个别成员提回 auto（映射形式）；列表形式全 manual
families:
  thesis:            # 学术论文：写作→检查→导出/排版全流程
    entry: thesis-writing
    members: [thesis-ref-check, md-to-thesis-latex, paper-metrics, paper-reader]
  drawing:           # 图表生成：软件工程图表（drawio-xml 为可编辑格式补充）
    entry: diagram
    members: [drawio-xml]
  frontend:          # 前端设计：2026-08-29 同批创建的设计规范三件套（页面/内联 SVG/数据可视化）
    entry: design-ui
    members: [design-diagram, design-dataviz]
  software:          # 软件工程：omo 4 技能为核心（debugging/git-master/programming/remove-ai-slops，
    entry: programming   # oh-my-openagent 4.17.1 vendored）+ test-guardian + repo 工程并入
    members: [debugging, git-master, remove-ai-slops, test-guardian, github-workflow, codegraph-explore]
    requires:
      cli: [git, gh]
      mcp: [codegraph]
  info:              # 信息与视觉：搜索/真实浏览器/图像理解
    entry: unified-search
    members: [kimi-webbridge, vision-workflow]
  dshplugin:         # DSH 插件：排查 + UI 优化（plugin-specialist 预设作用域）
    entry: dsh-plugin-troubleshooting
    members: [dsh-ui-optimization]
