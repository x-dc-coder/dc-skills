[project]
name = "claude-skills"
version = "0.1.0"
description = "Unified Python environment for Claude Code skills"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "sqlglot>=20.0.0",
    "python-docx>=1.1.0",
    "psycopg2-binary>=2.9.12",
    "cryptography>=48.0.0",
    "pymysql>=1.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "feedparser>=6.0.0",
    "playwright>=1.61.0",
    "pdfplumber>=0.11.10",
    # Chinese word segmentation for paper-metrics issue #22 (clause layer).
    # MIT, pure Python, CPU-only.  Only the new INFERRED-layer primitives use it;
    # the 14 frozen OBSERVED metrics stay character/unit based and byte-identical.
    "jieba>=0.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["word-extractor/scripts", "paper-reader/scripts", "paper-metrics/scripts", "thesis-writing/scripts", "unified-search/scripts", "newapi-management/scripts"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.uv]
package = false
